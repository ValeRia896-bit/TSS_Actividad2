server.port=8080

# --- PostgreSQL en la nube (Neon) ---
# La contraseña NO va escrita aquí: se lee de la variable de entorno DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-winter-bar-b62db1yp.c-2.sa-east-1.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${DB_USER:neondb_owner}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Neon suspende el servidor cuando está inactivo: pool pequeño y conexiones de vida corta
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate: crea y actualiza las tablas automáticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

# Subida de Excel
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
